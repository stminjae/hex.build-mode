      /**
       * Pixel start and width of the bar (or group) inside an interval that starts at
       * `intervalStart` and is `intervalPx` wide. Orientation-agnostic: the caller maps
       * start/width onto x/width or y/height.
       */
      export function intervalSlot(intervalStart, intervalPx, padding) {
          const inset = intervalInset(intervalPx, padding);
          return {
              start: intervalStart + inset,
              width: Math.max(1, intervalPx - 2 * inset),
          };
      }
      /** intervalSlot for an interval whose span sits on a continuous scale. */
      export function barSlot(scale, span, padding) {
          const a = scale(span[0]) ?? 0;
          const b = scale(span[1]) ?? 0;
          return intervalSlot(Math.min(a, b), Math.abs(b - a), padding);
      }
      /**
       * Where each of `count` grouped bars sits inside a group slot `groupPx`
       * wide: equal widths separated by a hairline, the group itself already
       * inset by the interval padding.
       */
      export function groupSlots(groupPx, count) {
          const n = Math.max(1, count);
          const available = Math.max(0, groupPx);
          const gap = n > 1 ? Math.min(GROUP_GAP_PX, available / (2 * n - 1)) : 0;
          const width = (available - (n - 1) * gap) / n;
          return {
              width,
              offset: function (index) {
                  return index * (width + gap);
              },
          };
      }
      /**
       * Pins the ends of a time scale's domain. An end left undefined keeps the
       * data-driven value.
       */
      export function boundTemporalDomain(scale, min, max) {
          const domain = scale.domain();
          const parsedMin = min != null ? +parseTemporal(min, "utc") : NaN;
          const parsedMax = max != null ? +parseTemporal(max, "utc") : NaN;
          const numeric = d3.scaleLinear().domain(domain.map(Number));
          applyNumericTicks(numeric, {
              min: isFinite(parsedMin) ? parsedMin : undefined,
              max: isFinite(parsedMax) ? parsedMax : undefined,
              nice: false,
          });
          scale.domain(numeric.domain().map((value) => new Date(value)));
      }
      /**
       * Applies chart-level tick and bound props to a linear scale and returns the
       * matching axis()/grid() opts. `min` / `max` pin an end of the domain; free
       * ends are niced (skip nicing with `nice: false` when the domain is fixed,
       * e.g. a normalized [0, 1] stack). Spacing wins over count and puts a tick
       * on every multiple of `spacing` inside the domain, unless that would be
       * more than MAX_SPACING_TICKS, in which case spacing is ignored. Bounds are
       * ordered: a min above a max swaps them, and a single pinned end the data
       * falls entirely beyond keeps its place with the free end one data span
       * away, so the axis never inverts.
       */
      const MAX_SPACING_TICKS = 200;
      /** Return ascending bounds; callers preserve their scale's original direction. */
      function resolveNumericDomain(domain, opts) {
          let lo = Math.min(domain[0] ?? 0, domain[1] ?? 0);
          let hi = Math.max(domain[0] ?? 0, domain[1] ?? 0);
          const fixedLo = opts.min != null && isFinite(opts.min);
          const fixedHi = opts.max != null && isFinite(opts.max);
          if (fixedLo)
              lo = opts.min;
          if (fixedHi)
              hi = opts.max;
          if (opts.includeZero) {
              if (!fixedLo)
                  lo = Math.min(lo, 0);
              if (!fixedHi)
                  hi = Math.max(hi, 0);
          }
          if (lo > hi) {
              if (fixedLo && fixedHi)
                  [lo, hi] = [hi, lo];
              else {
                  const span = Math.abs((domain[1] ?? 0) - (domain[0] ?? 0)) || 1;
                  if (fixedLo)
                      hi = lo + span;
                  else
                      lo = hi - span;
              }
          }
          if (opts.nice !== false) {
              const niced = opts.spacing != null
                  ? [
                      Math.floor(lo / opts.spacing) * opts.spacing,
                      Math.ceil(hi / opts.spacing) * opts.spacing,
                  ]
                  : d3.scaleLinear().domain([lo, hi]).nice(opts.count).domain();
              if (!fixedLo)
                  lo = niced[0];
              if (!fixedHi)
                  hi = niced[1];
          }
          return [lo, hi];
      }
      /** Reject grids that cannot advance safely or would exceed the tick budget. */
      function numericTickValues(lo, hi, spacing) {
          const first = Math.ceil(lo / spacing - 1e-6);
          const last = Math.floor(hi / spacing + 1e-6);
          if (!Number.isSafeInteger(first) ||
              !Number.isSafeInteger(last) ||
              last - first + 1 > MAX_SPACING_TICKS)
              return;
          const digits = Math.max(0, -Math.floor(Math.log10(spacing)) + 2);
          const values = [];
          for (let offset = 0; offset <= last - first; offset++) {
              const value = (first + offset) * spacing;
              const rounded = digits <= 100 ? +value.toFixed(digits) : +value.toPrecision(15);
              if (!Number.isFinite(rounded) ||
                  (values.length > 0 && rounded <= values[values.length - 1]))
                  return;
              values.push(rounded);
          }
          return values;
      }
      export function applyNumericTicks(scale, opts) {
          const previous = scale.domain();
          const count = opts.count != null && isFinite(opts.count) && opts.count >= 0
              ? opts.count
              : undefined;
          const commit = (domain) => {
              scale.domain(previous[0] > previous[1] ? domain.slice().reverse() : domain);
          };
          if (opts.spacing != null &&
              Number.isFinite(opts.spacing) &&
              opts.spacing > 0) {
              const domain = resolveNumericDomain(previous, { ...opts, count });
              const tickValues = numericTickValues(domain[0], domain[1], opts.spacing);
              if (tickValues != null) {
                  commit(domain);
                  return { tickValues };
              }
          }
          commit(resolveNumericDomain(previous, { ...opts, count, spacing: undefined }));
          return count != null ? { tickCount: count } : {};
      }
      /** Configure a range-less continuous scale; callers own domain geometry and placement. */
      export function continuousAxis(scale, opts) {
          const ticks = opts.type === "numeric"
              ? applyNumericTicks(scale, opts.numeric ?? {})
              : {};
          if (opts.type === "temporal")
              boundTemporalDomain(scale, opts.temporalMin, opts.temporalMax);
          const format = baseAxisFormatter(opts);
          return {
              scale,
              ticks,
              format,
              axisOpts: {
                  title: opts.title,
                  format: opts.type === "temporal"
                      ? opts.timeFormat != null
                          ? format
                          : undefined
                      : opts.numericFormat,
                  ...ticks,
              },
          };
      }
      /** Build a range-less base axis; layoutMargins sets its range before position/slot calls. */
      export function buildBaseAxis(data, cfg) {
          const present = data.filter((row) => row[cfg.field] != null);
          const parsed = new Map();
          for (const row of present) {
              const raw = row[cfg.field];
              const key = String(raw);
              if (!parsed.has(key))
                  parsed.set(key, parseBaseAxis(raw, cfg.type));
          }
          const keys = cfg.type === "categorical"
              ? orderCategories(cfg.measure != null
                  ? sumByKey(present, cfg.field, cfg.measure)
                  : new Map(Array.from(parsed.keys(), (key) => [key, 0])), cfg.order)
              : Array.from(parsed.keys())
                  .filter((key) => Number.isFinite(+parsed.get(key)))
                  .sort((a, b) => d3.ascending(+parsed.get(a), +parsed.get(b)));
          const padding = {
              pixels: cfg.paddingPixels,
              fraction: cfg.paddingFraction ?? DEFAULT_INTERVAL_PADDING_FRACTION,
          };
          if (cfg.type === "categorical") {
              const scale = cfg.geometry === "band"
                  ? d3.scaleBand().domain(keys).padding(0)
                  : d3.scalePoint().domain(keys).padding(0.5);
              return {
                  keys,
                  scale,
                  continuous: false,
                  ticks: {},
                  axisOpts: { title: cfg.title },
                  position: (raw) => raw == null ? undefined : scale(String(raw)),
                  slot: (key) => {
                      const start = scale(key);
                      return start == null
                          ? undefined
                          : intervalSlot(start, scale.bandwidth(), padding);
                  },
                  format: (raw) => String(raw),
              };
          }
          const values = keys.map((key) => parsed.get(key));
          const preBinned = cfg.type === "numeric" && cfg.preBinned;
          const spans = new Map();
          if (cfg.geometry === "band") {
              const interval = cfg.type === "temporal"
                  ? (cfg.temporalInterval ?? inferTemporalInterval(values))
                  : (cfg.numericInterval ?? inferNumericInterval(values));
              for (const key of keys)
                  spans.set(key, barSpan(parsed.get(key), interval, preBinned));
          }
          const domainValues = cfg.geometry === "band" ? Array.from(spans.values()).flat() : values;
          const extent = d3.extent(domainValues, Number);
          const scale = cfg.type === "temporal"
              ? d3
                  .scaleUtc()
                  .domain([new Date(extent[0] ?? 0), new Date(extent[1] ?? 0)])
              : d3.scaleLinear().domain([extent[0] ?? 0, extent[1] ?? 0]);
          const configured = continuousAxis(scale, {
              ...cfg,
              type: cfg.type,
              dates: cfg.type === "temporal" ? values : undefined,
              numeric: {
                  count: cfg.tickCount,
                  spacing: cfg.tickSpacing,
                  nice: cfg.geometry === "point",
                  min: cfg.numericMin,
                  max: cfg.numericMax,
                  includeZero: cfg.includeZero,
              },
          });
          return {
              ...configured,
              keys,
              continuous: true,
              position: (raw) => {
                  if (raw == null)
                      return undefined;
                  const value = Number(parseBaseAxis(raw, cfg.type));
                  return Number.isFinite(value) ? scale(value) : undefined;
              },
              slot: (key) => {
                  const span = spans.get(key);
                  return span ? barSlot(scale, span, padding) : undefined;
              },
              format: (raw) => {
                  const span = spans.get(String(raw));
                  return preBinned && span
                      ? formatNumericRange(Number(span[0]), Number(span[1]), cfg.numericFormat)
                      : configured.format(parsed.get(String(raw)) ?? parseBaseAxis(raw, cfg.type));
              },
          };
      }
