        /* Popover / floating menu hairline — matches Hex dark BorderColor.MUTED (Spellbook HexSelect dark). */
        --color-border-popover: #353548;
        --color-border-inverted: rgba(20, 20, 28, 0.2);
        --color-border-strong: #4a4552;
        --chart-mark-hover-brightness: 1.15;
        --intent-success-bg: rgba(67, 213, 157, 0.12);
        --intent-danger-bg: rgba(237, 111, 115, 0.12);
        --intent-warning-bg: rgba(255, 201, 64, 0.12);
        --intent-neutral-bg: rgba(177, 182, 196, 0.1);
        --intent-subtle-border: rgba(228, 230, 236, 0.14);
        --shadow-popover:
          0 0 0 2px hsl(0 0% 0% / 0.28), 0 0 0 1px var(--color-border-popover),
          0 -1px 0 -0.5px hsl(0 0% 100% / 0.05), 0 1px 1px -0.5px rgba(0, 0, 0, 0.1),
          0 2.63px 2.73px -1.32px rgba(0, 0, 0, 0.1),
          0 7.53px 7.94px -3.77px rgba(0, 0, 0, 0.1),
          0 15.69px 16.61px -7.85px rgba(0, 0, 0, 0.08),
          0 27.12px 28.76px -13.56px rgba(0, 0, 0, 0.02),
          0 41.82px 44.37px -20.91px rgba(0, 0, 0, 0),
          0 59.78px 63.45px -29.89px rgba(0, 0, 0, 0),
          0 81px 86px -40.5px rgba(0, 0, 0, 0);
      }

      body {
        font-family: var(--font-body);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        color: var(--color-text);
        background: var(--color-bg);
        font-variant-numeric: tabular-nums lining-nums;
        -webkit-font-smoothing: antialiased;
      }

      input::placeholder,
      textarea::placeholder {
        color: var(--color-text-placeholder);
        opacity: 1;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: 600;
        line-height: var(--leading-tight);
        letter-spacing: -0.025em;
      }

      .app-container {
        max-width: var(--content-max);
        margin: 0 auto;
        padding: var(--space-8);
      }

      .divider-solid {
        border: none;
        border-top: 1px solid var(--color-border);
      }
      .divider-gradient {
        border: none;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--color-border),
          transparent
        );
      }
      .label-mono {
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
  - path: charts.js
    contents: |
      // Chart components for the loyalty story.
      import { React, useHexData } from "app/_data.js";
      import { CartesianChart } from "app/components/CartesianChart.js";
      import { BarLineCombo } from "app/components/BarLineCombo.js";
      import { DonutChart } from "app/components/DonutChart.js";
      import { fmtPct, fmtMoney0, MONEY_FORMAT } from "app/format.js";

      // Shared Loyal / Not loyal color mapping, used by both headline donuts.
      const LOYALTY_COLORS = { "Loyal": "var(--viz-1)", "Not loyal": "var(--viz-10)" };

      var h = React.createElement;

      // ---- shared state wrapper ----
      function Frame({ state, minHeight, children }) {
        const { status, hasData, isEmpty } = state;
        if ((status === "RUNNING" || status === "QUEUED") && !hasData) {
          return h("div", {
            style: {
              minHeight, borderRadius: "var(--radius)",
              background: "var(--color-bg-muted)",
              animation: "pulse 1.5s ease-in-out infinite",
            },
          });
        }
        if ((status === "ERRORED" || status === "CANCELLED") && !hasData) {
          return h("div", {
            style: { minHeight, color: "var(--color-danger-text)", display: "flex", alignItems: "center" },
          }, "Unable to load this chart.");
        }
        if (isEmpty) {
          return h("div", {
            style: { minHeight, color: "var(--color-text-muted)", display: "flex", alignItems: "center" },
          }, "No data for the current selection.");
        }
        return children;
      }

      export function Takeaway({ children }) {
        return h(
          "p",
          {
            style: {
              margin: 0,
              marginTop: "var(--space-3)",
              color: "var(--color-text-muted)",
              fontSize: "var(--text-sm)",
              lineHeight: "var(--leading-normal)",
              maxWidth: "60ch",
            },
          },
          children,
        );
      }

      // ---- Headline: loyal vs not loyal, customer share vs revenue share ----
      export function HeadlineComparison() {
        const state = useHexData("01a10530-cae2-737d-9155-4266068facfe");
        const rows = state.rows || [];
        const customerData = React.useMemo(
          () => rows.map((r) => ({ group: r.customer_group, customers: r.customers })),
          [state.rows],
        );
        const revenueData = React.useMemo(
          () => rows.map((r) => ({ group: r.customer_group, revenue: r.revenue })),
          [state.rows],
        );
        return h(Frame, { state, minHeight: 320 },
          h("div", null,
            h("div", {
              style: {
                display: "grid",
                gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))",
                gap: "var(--space-4)",
              },
            },
              h(DonutChart, {
                instanceId: "loyal-vs-not-customer-share",
                data: customerData,
                title: "Customer share: loyal vs. not loyal",
                valueField: "customers",
                colorField: "group",
                colorCategoricalMap: LOYALTY_COLORS,
                colorCategoricalOrder: ["Loyal", "Not loyal"],
                valueNumericFormat: ",.0f",
                dataLabelsVisible: true,
                legendPosition: "bottom",
                height: 320,
              }),
              h(DonutChart, {
                instanceId: "loyal-vs-not-revenue-share",
                data: revenueData,
                title: "Revenue share: loyal vs. not loyal",
                valueField: "revenue",
                colorField: "group",
                colorCategoricalMap: LOYALTY_COLORS,
                colorCategoricalOrder: ["Loyal", "Not loyal"],
                valueNumericFormat: MONEY_FORMAT,
                dataLabelsVisible: true,
                legendPosition: "bottom",
                height: 320,
              }),
            ),
          ),
        );
      }

      // ---- Profit gain by market (what-if, uses fixed tiers) ----
      export function ProfitGainByMarket() {
        const state = useHexData("01a10529-55fd-7549-b1ab-27f1c4a1a024");
        const data = React.useMemo(
          () => (state.rows || []).map((r) => ({ market: r.market, profit_gain: r.profit_gain })),
          [state.rows],
        );
        return h(Frame, { state, minHeight: 320 },
          h(CartesianChart, {
            instanceId: "profit-gain-by-market",
            data,
            title: "Added profit if Regulars convert to Loyal, by market",
            markMode: "grouped-bar",
            orientation: "horizontal",
            baseAxisField: "market",
            valueAxisField: "profit_gain",
            valueAxisTitle: "Profit Gain ($)",
            valueAxisNumericFormat: MONEY_FORMAT,
            valueAxisNumericMin: -10000,
            valueAxisNumericMax: 30000,
            baseAxisCategoricalOrder: "-value",
            dataLabelsVisible: true,
            dataLabelNumericFormat: MONEY_FORMAT,
            height: 340,
          }),
        );
      }

      // ---- generic single-metric rate bar ----
      function RateBar({ cellRef, instanceId, title, baseField, valueField, baseTitle, valueTitle, orientation, order, height, minHeight, extraTooltipFields, tooltipHideValueRow }) {
        const state = useHexData(cellRef);
        const data = React.useMemo(
          () => (state.rows || []).map((r) => ({ [baseField]: r[baseField], [valueField]: r[valueField] })),
          [state.rows, baseField, valueField],
        );
        const tooltipExtraByBase = React.useMemo(() => {
          if (!extraTooltipFields || !extraTooltipFields.length) return undefined;
          const map = {};
          (state.rows || []).forEach((r) => {
            map[r[baseField]] = extraTooltipFields.map((f) => ({
              label: f.label,
              value: f.format ? f.format(r[f.field]) : r[f.field],
            }));
          });
          return map;
        }, [state.rows, baseField, extraTooltipFields]);
        return h(Frame, { state, minHeight: minHeight || 300 },
          h(CartesianChart, {
            instanceId,
            data,
            title,
            markMode: "grouped-bar",
            orientation: orientation || "vertical",
            baseAxisField: baseField,
            valueAxisField: valueField,
            baseAxisCategoricalOrder: order || "-value",
            tooltipHideValueRow: tooltipHideValueRow || false,
            valueAxisTitle: valueTitle,
            valueAxisNumericFormat: ".0%",
            baseAxisTitle: baseTitle || "",
            dataLabelsVisible: true,
            dataLabelNumericFormat: ".0%",
            tooltipExtraByBase,
            height: height || 320,
          }),
        );
      }

      export function GatewayProducts() {
        return h(RateBar, {
          cellRef: "01a10379-0dd0-7643-a8ea-34f5a7d2318c",
          instanceId: "gateway-products",
          title: "Loyal rate by first-purchase sub-category",
          baseField: "sub_category",
          valueField: "loyal_rate",
          valueTitle: "Loyal Rate",
          orientation: "horizontal",
          order: "-value",
          height: 460, minHeight: 440,
        });
      }

      export function SecondOrderSpeed() {
        return h(RateBar, {
          cellRef: "01a104fd-21cf-7299-9f27-11f83bb22e4c",
          instanceId: "second-order-speed",
          title: "Loyal rate by time to second order",
          baseField: "time_to_second_order",
          valueField: "loyal_rate",
          baseTitle: "Time to Second Order",
          valueTitle: "Loyal Rate",
          order: "label",
          height: 320,
        });
      }

      // Join a list of names into natural English: "A", "A and B", "A, B and C".
      function joinNames(names) {
        if (names.length === 0) return "";
        if (names.length === 1) return names[0];
        if (names.length === 2) return names[0] + " and " + names[1];
        return names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
      }

      function buildMarketLoyaltyTitle(rows) {
        const valid = (rows || [])
          .filter((r) => r.market != null && Number.isFinite(Number(r.loyal_rate)))
          .map((r) => ({ market: r.market, rate: Number(r.loyal_rate) }))
          .sort((a, b) => b.rate - a.rate);
        if (valid.length === 0) return "Loyal rate by market";
        if (valid.length === 1) {
          const m = valid[0];
          return `${m.market} converts ${fmtPct(m.rate)} of customers into loyal buyers`;
        }
        const strong = valid.filter((r) => r.rate >= 0.25).map((r) => r.market);
        const weak = valid.filter((r) => r.rate < 0.1).map((r) => r.market);
        if (strong.length && weak.length) {
          return `Loyalty is strong in ${joinNames(strong)} but nearly absent in ${joinNames(weak)}`;
        }
        if (strong.length) {
          return `Loyalty is strong in ${joinNames(strong)}`;
        }
        if (weak.length) {
          return `Loyalty is nearly absent in ${joinNames(weak)}`;
        }
        const top = valid[0];
        return `${top.market} leads loyalty at ${fmtPct(top.rate)}`;
      }

      export function MarketLoyalty() {
        const state = useHexData("01a10308-ea57-7158-81fd-4085f869fcaf");
        const title = React.useMemo(() => buildMarketLoyaltyTitle(state.rows), [state.rows]);
        return h(RateBar, {
          cellRef: "01a10308-ea57-7158-81fd-4085f869fcaf",
          instanceId: "market-loyalty",
          title,
          baseField: "market",
          valueField: "loyal_rate",
          valueTitle: "Loyal Rate",
          tooltipHideValueRow: true,
          extraTooltipFields: [
            { field: "profit_per_loyal_customer", label: "Profit per loyal customer", format: (v) => fmtMoney0(v) },
          ],
          height: 320,
        });
      }

      // gateway_lift is a fraction (0.09 = +9 pts). Boosters lift loyalty by >= +3 pts,
      // drags lower it by <= -3 pts; rows between are treated as roughly neutral.
      function liftPts(rate) {
        return Math.round(rate * 100);
      }
      function fmtLiftPts(rate) {
        const p = liftPts(rate);
        return (p >= 0 ? "+" : "") + p + " pts";
      }

      function buildGatewayLiftTitle(rows) {
        const valid = (rows || [])
          .filter((r) => r.market != null && Number.isFinite(Number(r.gateway_lift)))
          .map((r) => ({ market: r.market, lift: Number(r.gateway_lift) }))
          .sort((a, b) => b.lift - a.lift);
        if (valid.length === 0) return "Furniture-first loyalty lift by market";
        if (valid.length === 1) {
          const m = valid[0];
          const p = liftPts(m.lift);
          if (p >= 3) return `A furniture-first purchase lifts loyalty in ${m.market} (${fmtLiftPts(m.lift)})`;
          if (p <= -3) return `A furniture-first purchase lowers loyalty in ${m.market} (${fmtLiftPts(m.lift)})`;
          return `A furniture-first purchase barely moves loyalty in ${m.market} (${fmtLiftPts(m.lift)})`;
        }
        const label = (arr) => joinNames(arr.map((r) => `${r.market} (${fmtLiftPts(r.lift)})`));
        const boosters = valid.filter((r) => liftPts(r.lift) >= 3);
        const drags = valid.filter((r) => liftPts(r.lift) <= -3);
        if (boosters.length && drags.length) {
          return `A furniture-first purchase lifts loyalty in ${label(boosters)} but lowers it in ${label(drags)}`;
        }
        if (boosters.length) {
          return `A furniture-first purchase lifts loyalty in ${label(boosters)}`;
        }
        if (drags.length) {
          return `A furniture-first purchase lowers loyalty in ${label(drags)}`;
        }
        return "A furniture-first purchase barely moves loyalty across markets";
      }

      export function GatewayLift() {
        const state = useHexData("01a1052d-6e09-746e-964e-070d0739407e");
        const title = React.useMemo(() => buildGatewayLiftTitle(state.rows), [state.rows]);
        return h(RateBar, {
          cellRef: "01a1052d-6e09-746e-964e-070d0739407e",
          instanceId: "gateway-lift",
          title,
          baseField: "market",
          valueField: "gateway_lift",
          valueTitle: "Loyal Rate Lift",
          height: 320,
        });
      }

      // ---- Loyal spend: share of spend + margin ----
      export function LoyalSpend() {
        const state = useHexData("01a104c2-60c0-7248-97f9-eccd14264402");
        const data = React.useMemo(
          () => (state.rows || []).map((r) => ({
            sub_category: r.sub_category,
            share_of_loyal_spend: r.share_of_loyal_spend,
            margin: r.margin,
            loyal_profit: r.loyal_profit,
            avg_sales_per_loyal_buyer: r.avg_sales_per_loyal_buyer,
            avg_profit_per_loyal_buyer: r.avg_profit_per_loyal_buyer,
          })),
          [state.rows],
        );
        return h("div", { "data-testid": "loyal-spend-wrap" },
         h(Frame, { state, minHeight: 560 },
          h(BarLineCombo, {
            instanceId: "loyal-spend",
            data,
            title: "",
            baseAxisField: "sub_category",
            barValueAxisField: "share_of_loyal_spend",
            lineValueAxisField: "margin",
            baseAxisCategoricalOrder: "-barValue",
            barValueAxisTitle: "Share of Loyal Spend",
            barValueAxisNumericFormat: ".0%",
            lineValueAxisTitle: "Margin",
            lineValueAxisNumericFormat: ".0%",
            orientation: "horizontal",
            height: 560,
            barNegativeColorField: "loyal_profit",
            extraTooltipFields: [
              { label: "Avg sales per loyal buyer", field: "avg_sales_per_loyal_buyer", format: "$,.0f" },
              { label: "Avg profit per loyal buyer", field: "avg_profit_per_loyal_buyer", format: "$,.0f" },
              { label: "Total profit", field: "loyal_profit", format: "$.2~s" },
            ],
          }),
        ));
      }
