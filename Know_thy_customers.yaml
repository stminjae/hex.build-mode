      // Interactive controls wired to notebook inputs.
      import { React, useHexInput, setHexInput } from "app/_data.js";
      import { Select } from "app/components/Select.js";

      var h = React.createElement;

      // A labeled range slider bound to a Hex slider input.
      export function HexSlider({ cellRef, label, suffix, formatValue }) {
        const input = useHexInput(cellRef);
        const [local, setLocal] = React.useState(null);
        if (input == null) {
          return h("div", { style: { minWidth: 220, height: 44 } });
        }
        const opts = input.options || {};
        const min = opts.min != null ? opts.min : 0;
        const max = opts.max != null ? opts.max : 100;
        const step = opts.step != null ? opts.step : 1;
        const value = local != null ? local : input.currentValue;
        const shown = formatValue ? formatValue(value) : value + (suffix || "");

        return h(
          "div",
          { style: { display: "flex", flexDirection: "column", gap: "var(--space-1)", minWidth: 220 } },
          h(
            "div",
            { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: "var(--space-3)" } },
            h("span", { style: { fontSize: "var(--text-sm)", color: "var(--color-text-muted)" } }, label),
            h("span", { style: { fontSize: "var(--text-sm)", fontWeight: "var(--font-weight-semibold)", color: "var(--color-text)" } }, shown),
          ),
          h("input", {
            type: "range",
            min, max, step,
            value,
            onChange: (e) => setLocal(Number(e.target.value)),
            onMouseUp: (e) => { setHexInput(cellRef, Number(e.target.value)); setLocal(null); },
            onKeyUp: (e) => { setHexInput(cellRef, Number(e.target.value)); setLocal(null); },
            onTouchEnd: (e) => { setHexInput(cellRef, Number(e.target.value)); setLocal(null); },
            style: { width: "100%", accentColor: "var(--viz-1)", cursor: "pointer" },
          }),
        );
      }

      // A labeled dropdown bound to a Hex dropdown input.
      export function HexDropdown({ cellRef, label }) {
        const input = useHexInput(cellRef);
        if (input == null) {
          return h("div", { style: { minWidth: 160, height: 38 } });
        }
        const raw = (input.options && input.options.valueOptions) || [];
        const options = raw.map((o) => ({ value: String(o), label: String(o) }));
        return h(
          "div",
          { style: { display: "flex", flexDirection: "column", gap: "var(--space-1)" } },
          label
            ? h("span", { style: { fontSize: "var(--text-sm)", color: "var(--color-text-muted)" } }, label)
            : null,
          h(Select, {
            value: String(input.currentValue),
            onValueChange: (v) => setHexInput(cellRef, v),
            options,
            size: "sm",
          }),
        );
      }
  - path: format.js
    contents: |
      // Shared formatters and constants for the loyalty story.
      import { d3 } from "app/_data.js";

      // Standard format for all financial / currency values across the app.
      // Reuse this constant for chart value formats, data labels, tooltips, and inline text.
      export const MONEY_FORMAT = "$.2s";

      export function fmtPct(v, digits) {
        if (v == null || isNaN(v)) return "--";
        const d = digits == null ? 0 : digits;
        return (v * 100).toFixed(d) + "%";
      }

      const moneyFormatter = d3.format(MONEY_FORMAT);

      export function fmtMoney(v) {
        if (v == null || isNaN(v)) return "--";
        return moneyFormatter(v);
      }

      const money0Formatter = d3.format("$,.0f");

      // Whole-dollar currency, no decimals (e.g. $1,234).
      export function fmtMoney0(v) {
        if (v == null || isNaN(v)) return "No loyal customers";
        return money0Formatter(v);
      }

      export function fmtInt(v) {
        if (v == null || isNaN(v)) return "--";
        return Math.round(v).toLocaleString("en-US");
      }

      // Loyalty tiers
      export const TIERS = [
        { label: "One-time", range: "1 order" },
        { label: "Occasional", range: "2\u20133 orders" },
        { label: "Regular", range: "4\u20136 orders" },
        { label: "Loyal", range: "7+ orders" },
      ];
