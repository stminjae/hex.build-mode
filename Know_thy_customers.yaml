        padding: 0;
        cursor: inherit;
        border: none;
        line-height: inherit;
      }

      .rdp-dropdown_root {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      .rdp-dropdown_root[data-disabled="true"] .rdp-chevron {
        opacity: var(--rdp-disabled-opacity);
      }

