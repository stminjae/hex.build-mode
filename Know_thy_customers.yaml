  - cellType: SQL
    cellId: 01a10358-3b64-703f-81b4-ece0ccfb3c0c # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Order lines enriched (order lines + loyalty info)
    config:
      source: |-
        WITH first_orders AS (
            SELECT
                market || '-' || customer_id AS customer_key
                ,order_id
            FROM superstore_sales
            GROUP BY 1, 2
            QUALIFY ROW_NUMBER() OVER (
                PARTITION BY market || '-' || customer_id
                ORDER BY MIN(order_date), order_id
            ) = 1
        )

        SELECT
            c.customer_key
            ,c.customer_name
            ,c.market
            ,c.customer_segments
            ,c.orders
            ,r.order_id
            ,r.order_date
            ,r.category
            ,r.sub_category
            ,r.product_name
            ,r.sales
            ,r.profit
            ,f.order_id IS NOT NULL AS is_first_order
        FROM superstore_sales r
        JOIN customer_summary c
            ON c.customer_key = r.market || '-' || r.customer_id
        LEFT JOIN first_orders f
            ON f.customer_key = c.customer_key
            AND f.order_id = r.order_id
      dataFrameCell: true
      dataConnectionId: null
      resultVariableName: order_lines_enriched
