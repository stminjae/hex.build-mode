    cellId: 01a10f45-ec0c-750d-81fe-95aa798a5295 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Tier table
    config:
      source: |-
        ## Definitions
        | Tier | Orders |
        |---|---|
        | One-time | 1 |
        | Occasional | 2–3 |
        | Regular | 4–6 |
        | Loyal | 7+ |
  - cellType: INPUT
    cellId: 01a10525-69d5-709f-a028-fd76bf27c22f # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: convert_pct
    config:
      inputType: SLIDER
      name: convert_pct
      outputType: NUMBER
      options:
        min: 0
        max: 30
        step: 5
      defaultValue: 10
  - cellType: CODE
    cellId: 01a10512-0b3e-75f2-bcc7-0102fc0f61d8 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: market_conversion
    config:
      source: |-
        # 1. Split customers (one row per customer, from SQL) into two groups
        #    Fixed definitions: Regular = 4-6 orders, Loyal = 7+ orders
        import pandas as pd
        pool = customer_summary if market == "All" else customer_summary[customer_summary.market == market]

        if order_year != "All":
            yr = order_lines_enriched[pd.to_datetime(order_lines_enriched.order_date).dt.year.astype(str) == str(order_year)]
            pool = pool[pool.customer_key.isin(yr.customer_key)]

        regulars = pool[pool.orders.between(4, 6)]
        loyal = pool[pool.orders >= 7]

        # 2. Per market: how many regulars, and average profit of each group
        regular_stats = regulars.groupby("market").agg(
            regulars=("customer_key", "count"),
            regular_profit=("profit", "mean"))
        loyal_stats = loyal.groupby("market").agg(
            loyal_profit=("profit", "mean"))

        # 3. Put them side by side, one row per market (Canada drops: no Loyal customers)
        mc = regular_stats.join(loyal_stats, how="inner").reset_index()

        # 4. What-if: convert_pct% of regulars become Loyal
        mc["gain_per_customer"] = mc.loyal_profit - mc.regular_profit
        mc["customers_converted"] = mc.regulars * convert_pct / 100
        mc["profit_gain"] = mc.customers_converted * mc.gain_per_customer
        market_conversion = mc.sort_values("profit_gain", ascending=False)

        # Total across markets where converting pays (Africa excluded)
        total_profit_gain = market_conversion.profit_gain[market_conversion.profit_gain > 0].sum()
