       * DatePicker styles — react-day-picker base CSS plus Hex theming.
       *
       * Source: react-day-picker@9.14.0 (verbatim from node_modules/react-day-picker/src/style.css).
       * The seeded `DatePicker.js` side-effect-imports this file so the iframe runtime
