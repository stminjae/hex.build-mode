    cellId: 01a109e2-48b2-72fc-bf9c-9e37f6b4592e # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: "Follow-ups: Tables as loss leader"
    config:
      source: |-
        ### Next Steps: Analyze ROI on Tables 
        - **Tables open the door, other categories pay the bills.** Tables-first customers have the highest loyal rate (~43%), yet Tables lose money for loyal buyers (-10% margin, ~-$44K). Check whether high-margin categories (Copiers, Phones, Bookcases, Appliances) cover the loss.
        - **Fix price, not assortment.** Test whether Tables' negative margin is discount-driven (margin by discount band), rather than cutting Tables.
        - **Prove the loss leader pays off.** Compare lifetime profit of customers whose first order included Tables vs. everyone else, by market (correlation vs. causation caveat).
