    cellId: 01a10530-cae2-737d-9155-4266068facfe # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: loyal_revenue_by_year
    config:
      source: |-
        SELECT
            CASE WHEN orders >= {{ loyal_order_threshold }} THEN 'Loyal' ELSE 'Not loyal' END AS customer_group
            ,COUNT(DISTINCT customer_key) AS customers
            ,SUM(sales) AS revenue
            ,SUM(sales) / COUNT(DISTINCT customer_key) AS revenue_per_customer
            ,SUM(profit) AS profit
            ,COUNT(DISTINCT customer_key) / SUM(COUNT(DISTINCT customer_key)) OVER () AS share_of_customers
            ,SUM(sales) / SUM(SUM(sales)) OVER () AS share_of_revenue
        FROM order_lines_enriched
        WHERE ({{ market }} = 'All' OR market = {{ market }})
          AND ({{ order_year }} = 'All' OR CAST(YEAR(order_date) AS VARCHAR) = {{ order_year }})
        GROUP BY 1
        ORDER BY 1
