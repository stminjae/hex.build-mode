          0 8px 24px rgba(11, 14, 22, 0.08), 0 2px 8px rgba(11, 14, 22, 0.04),
          0 0 0 1px rgba(11, 14, 22, 0.06);
        /* Matches Hex app theme.boxShadow.POPOVER (HexPopover / Spellbook HexSelect). */
