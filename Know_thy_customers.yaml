        --color-danger-text: #ed6f73;
        --color-danger-fill: #4d1a1e;
        --color-danger-border: #6b2a2f;
        --color-warning: #ffc940;
        --color-warning-fill: #4d3a0a;
        --color-warning-border: #6b5014;
        --color-link: #6a97e8;
