    cellLabel: Do different customers share order_id?
    config:
      source: |-
        /* Is an order_id unqiue to a customer_id? */
        SELECT 
            order_id
            ,COUNT(DISTINCT customer_id) AS customer_count
            ,STRING_AGG(DISTINCT customer_id, ',') AS customer_ids
