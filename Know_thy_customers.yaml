    cellId: 01a104c2-60c0-7248-97f9-eccd14264402 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Loyal spend
    config:
      source: |+
        /* Loyal customers only: share of their spend by sub-category, and its margin.
           Spend = SUM(sales); margin = SUM(profit) / SUM(sales) */
        SELECT
            sub_category
            ,SUM(sales) AS loyal_sales
            ,SUM(sales) / SUM(SUM(sales)) OVER () AS share_of_loyal_spend
            ,SUM(profit) / SUM(sales) AS margin
            ,SUM(profit) AS loyal_profit
