  - cellType: SQL
    cellId: 01a102af-02ee-77fd-8313-2b738eb5db31 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: How we defined loyalty
    config:
      source: |
        WITH dist AS (
            -- How many customers have exactly N orders
            SELECT
                orders
                ,COUNT(*) AS customers
            FROM customer_summary
            GROUP BY orders
        )

        -- Running total from the top = customers with N or more orders
        SELECT
            orders
            ,customers
            ,SUM(customers) OVER (ORDER BY orders DESC) AS customers_at_or_above
            ,SUM(customers) OVER (ORDER BY orders DESC)/ SUM(customers) OVER () AS share_at_or_above
            ,orders = {{ loyal_order_threshold }} AS is_selected_threshold
        FROM dist
        ORDER BY orders
